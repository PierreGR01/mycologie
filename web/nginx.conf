# Service statique de la PWA (web/dist) et des données du pipeline (web/data, sous /data/).
# Nginx gère nativement les requêtes HTTP Range nécessaires à PMTiles.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers qui doivent être revalidés à chaque visite.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Fichiers versionnés par Vite : mis en cache durablement.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Données publiées chaque jour : revalidation (ETag), Range activé par défaut.
    location /data/ {
        add_header Cache-Control "no-cache";
        location ~ \.pmtiles$ { default_type application/octet-stream; add_header Cache-Control "no-cache"; }
        location ~ \.(geo)?json$ { default_type application/json; add_header Cache-Control "no-cache"; }
    }
}
