services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: myco
      POSTGRES_PASSWORD: myco
      POSTGRES_DB: myco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myco -d myco"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
