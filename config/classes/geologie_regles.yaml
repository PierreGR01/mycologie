# Classement semi-automatique des unités géologiques en classes de substrat : notations de la
# BD Charm-50 ou entités de la BD LISA (code, libellé et lithologies).
# Le résultat est écrit dans config/classes/geologie.csv (BD Charm-50) ou geologie_bdlisa.csv,
# à relire : une classe corrigée à la main dans la colonne `classe` est conservée aux exécutions
# suivantes.

classes:
  calcaire: 1
  marno_calcaire: 2
  siliceux: 3
  detritique_mixte: 4
  alluvions_recentes: 5
  indetermine: 9

# Règles appliquées dans l'ordre : la première qui correspond l'emporte.
# `notation` : expression régulière sur la notation BRGM ou le code BD LISA.
# `texte` : expression régulière sur notation + description + lithologie + géochimie.
# Les deux sont comparées en minuscules et sans accents.
regles:
  - {classe: alluvions_recentes, notation: "^fz"}
  - {classe: alluvions_recentes, texte: "alluvions? (fluviatiles? )?(recentes|actuelles|modernes)"}
  - {classe: calcaire, texte: "eboulis[^.;]*calcaire"}
  - {classe: detritique_mixte, texte: "moraine|glaciaire|colluvi|eboulis|molasse|cones? de dejection|alluvions? anciennes|terrasse|loess|\\blimons?\\b|cailloutis|conglomerat|\\bsables?\\b|\\b(gunz|mindel|riss|wurm)"}
  # BD LISA : « Alluvions de l'Isère… », « Alluvions du Rhône… » (fonds de vallée actuels).
  - {classe: alluvions_recentes, texte: "\\balluvions? (a |de |du |des |d'|en |entre )"}
  # Roches volcaniques (Velay, Devès, Mézenc en Haute-Loire) : sols non calcaires, acides à
  # neutres (andosols), rangés avec le siliceux ; le pH SoilGrids nuance. Avant les règles
  # calcaires : les « tufs » de maar sont volcaniques. Ajouté le 07/11/2026.
  - {classe: siliceux, texte: "volcan|basalt|basanit|phonolit|trachy|andesit|pyroclast|epiclast|\\bmaar\\b|lahar|hawaiite|benmoreite|mugearite|nephelinite|ankaramit|scorie|pouzzolane|cinerite"}
  - {classe: marno_calcaire, texte: "\\bmarne|marneu|marno|argilo-calcaire|calcschiste|flysch|terres noires"}
  - {classe: calcaire, texte: "calcaire|dolomi|\\bcraie|\\btufs?\\b|travertin|urgonien"}
  - {classe: siliceux, texte: "granit|gneiss|micaschiste|schistes? cristallin|amphibolite|migmatite|anatexite|quartzite|\\bgres\\b|rhyolite|leptynite|gabbro|diorite|spilite|houiller|pegmatite|cristallin|cristallophyllien|roches? (metamorphique|magmatique|plutonique)|metaplutonite|granitoide|metatexite|granulite|eclogite|arkose"}

# Formations superficielles d'origine locale (moraines, éboulis, colluvions, cônes) de la BD Charm-50 :
# elles héritent de la classe de la roche sous-jacente (entité affleurante de la BD LISA) quand
# celle-ci est calcaire, marno-calcaire ou siliceuse. Ex. : moraine du Vercors → calcaire ;
# moraine du Bas-Dauphiné (molasse, cailloutis) → reste détritique. Validé le 05/11/2026.
# Les alluvions fluvio-glaciaires, transportées loin, ne sont pas concernées.
couverture:
  source: bdlisa
  unites: "moraine|\\bdepots glaciaires|eboulis|colluvi|cones? (de dejection|torrentiels|mixtes)|depots de versants"
  classes: [calcaire, marno_calcaire, siliceux]
