# Paramètres généraux du pipeline.
# Les règles écologiques sont dans config/especes/ (une espèce par fichier), jamais dans le code.

departement: "38"

grille:
  crs: "EPSG:2154"
  resolution_m: 25        # minimum autorisé : 25 m (précision des sources)
  tampon_m: 1000          # marge autour du département (calcul des pentes en bordure)

chemins:
  brut: data/raw
  statique: data/static
  habitat: data/habitat
  runs: data/runs                # champs météo et scores intermédiaires, par date de run
  publication: web/public/data   # fichiers servis tels quels par la PWA (PMTiles, latest.json)
  rapports: reports

# Surchargeable par la variable d'environnement DATABASE_URL.
base_de_donnees: postgresql+psycopg://myco:myco@localhost:5432/myco

reseau:
  delai_s: 300
  tentatives: 6            # coupures réseau ponctuelles observées vers Open-Meteo

# Météo (étape 4) : échantillonnage Open-Meteo, correction d'altitude, dates calculées.
meteo:
  url: https://api.open-meteo.com/v1/forecast
  modele: best_match
  fuseau: Europe/Paris
  espacement_m: 2500        # maille d'échantillonnage (D6) ; repli : 5000
  tampon_m: 5000            # points échantillonnés autour du département
  gradient_c_par_m: 0.0065  # −0,65 °C par 100 m
  jours_avant: 7            # dates affichées : J-7 …
  jours_apres: 7            # … J+7
  taille_lot: 100           # points par requête
  appels_par_minute: 500    # sous la limite de l'API gratuite (600/min, 5 000/h, 10 000/jour)
  retention_runs: 3

# Affichage commun à toutes les espèces : score (0–1) en 5 classes ; un score nul est transparent.
affichage:
  zoom_min: 8
  zoom_max: 12            # ≈ 27 m/px à 45° N : pas de tuile plus fine que la grille de 25 m
  classes:
    - {min: 0.0, libelle: "très faible", couleur: "#ffffb2"}
    - {min: 0.2, libelle: "faible",      couleur: "#fecc5c"}
    - {min: 0.4, libelle: "moyen",       couleur: "#fd8d3c"}
    - {min: 0.6, libelle: "bon",         couleur: "#f03b20"}
    - {min: 0.8, libelle: "très bon",    couleur: "#bd0026"}

# Sources ouvertes : URL d'accès, licence et attribution affichée dans la PWA.
# Les points marqués « à confirmer » n'ont pas encore pu être vérifiés sur les serveurs.
sources:
  admin_express:
    nom: ADMIN EXPRESS COG (IGN)
    licence: Licence Ouverte Etalab 2.0
    attribution: "© IGN – ADMIN EXPRESS"
    url: https://geoservices.ign.fr/adminexpress
    wfs: https://data.geopf.fr/wfs/ows
    couche: "ADMINEXPRESS-COG.LATEST:departement"
    champ_code: code_insee
    champ_nom: nom_officiel

  rgealti:
    nom: RGE ALTI® 5 m (IGN)
    licence: Licence Ouverte Etalab 2.0
    attribution: "© IGN – RGE ALTI®"
    url: https://geoservices.ign.fr/rgealti
    # Recherche de l'archive dans le flux Atom du service de téléchargement de la Géoplateforme.
    # Pour forcer une URL, renseigner `archive`. On peut aussi déposer l'archive (.7z ou .7z.001…)
    # à la main dans data/raw/rgealti/.
    flux: https://data.geopf.fr/telechargement/resource/RGEALTI?zone=D038
    motif: "RGEALTI_2-0_5M_ASC_LAMB93-IGN69_D038"
    archive: null
    # Dalles de MNT à extraire (les livraisons contiennent aussi des dalles annexes).
    motif_dalles: "_MNT_.*\\.asc$"
    nodata: -99999

  bdforet:
    nom: BD Forêt® V2 (IGN)
    licence: Licence Ouverte Etalab 2.0
    attribution: "© IGN – BD Forêt® V2"
    url: https://geoservices.ign.fr/bdforet
    wfs: https://data.geopf.fr/wfs/ows
    couche: "LANDCOVER.FORESTINVENTORY.V2:formation_vegetale"
    champs: {code_tfv: code_tfv, tfv: tfv, essence: essence}
    taille_page: 5000

  bdcharm50:
    nom: BD Charm-50, carte géologique harmonisée au 1/50 000 (BRGM)
    licence: Licence Ouverte Etalab 2.0 (à confirmer)
    attribution: "© BRGM – BD Charm-50"
    url: https://infoterre.brgm.fr
    archive: https://infoterre.brgm.fr/telechargements/BDCharm50/GEO050K_HARM_038.zip
    couche_motif: "*S_FGEOL*.shp"
    champs: {notation: NOTATION, descr: DESCR, lithologie: LITHOLOGIE, geochimie: GEOCHIMIE}

  soilgrids:
    nom: SoilGrids 2.0 – pH eau (ISRIC)
    licence: CC BY 4.0
    attribution: "ISRIC – SoilGrids"
    url: https://www.isric.org/explore/soilgrids
    vrt: https://files.isric.org/soilgrids/latest/data/phh2o/phh2o_{profondeur}_mean.vrt
    # Épaisseur de chaque horizon (cm), utilisée comme poids de la moyenne 0–30 cm.
    profondeurs: {"0-5cm": 5, "5-15cm": 10, "15-30cm": 15}

  # Sources utilisées aux étapes suivantes, déclarées ici pour les attributions.
  plan_ign:
    nom: Plan IGN v2
    licence: Licence Ouverte Etalab 2.0
    attribution: "© IGN – Plan IGN"
    url: https://geoservices.ign.fr/services-web-experts-cartes
  open_meteo:
    nom: Open-Meteo (Forecast et Historical Weather API)
    licence: CC BY 4.0
    attribution: "Weather data by Open-Meteo.com (Météo-France, ECMWF, DWD)"
    url: https://open-meteo.com
  gbif:
    nom: GBIF – observations (CC0 et CC BY uniquement)
    licence: CC0 / CC BY 4.0 selon les jeux de données
    attribution: "GBIF.org (DOI du téléchargement dans le rapport de calibrage)"
    url: https://www.gbif.org
  openobs:
    nom: INPN / OpenObs (MNHN – PatriNat)
    licence: à confirmer
    attribution: "INPN / OpenObs – PatriNat"
    url: https://openobs.mnhn.fr
  taxref:
    nom: TAXREF (MNHN)
    licence: Licence Ouverte Etalab 2.0
    attribution: "TAXREF – MNHN"
    url: https://taxref.mnhn.fr
