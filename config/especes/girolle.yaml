# Girolle – valeurs validées le 22/10/2026 (PLAN.md §4), à ajuster au calibrage.
id: girolle
nom: Girolle
taxons: [Cantharellus cibarius]
avertissement: null

habitat:
  combinaison: moyenne_geometrique
  facteurs:
    essence:
      {couche: foret, type: table, poids: 3, bloquant: true, defaut: 0,
       valeurs: {hetre: 1.0, chenes_decidus: 0.9, chataignier: 0.9, robinier: 0.1,
                 autres_feuillus: 0.6, melange_feuillus: 0.8, peupleraie: 0.0, sapin_epicea: 0.8,
                 pin_sylvestre: 0.7, autres_pins: 0.4, meleze: 0.3, douglas: 0.4,
                 melange_coniferes: 0.6, mixte_feuillus: 0.9, mixte_coniferes: 0.8,
                 foret_ouverte: 0.5, lande_ligneuse: 0.1}}
    substrat:
      {couche: geol, type: table, poids: 2,
       valeurs: {siliceux: 1.0, detritique_mixte: 0.8, marno_calcaire: 0.4, calcaire: 0.3,
                 alluvions_recentes: 0.3, indetermine: 0.6}}
    ph:       {couche: ph, type: trapeze, poids: 0.5, points: [3.5, 4.0, 5.5, 6.8], plancher: 0.3}
    altitude: {couche: alt, type: trapeze, poids: 1, points: [100, 300, 1600, 2000]}
    pente:    {couche: pente, type: trapeze, poids: 1, points: [0, 0, 30, 45], plancher: 0.3}
    exposition:
      {couche: expo, type: table, poids: 0.5,
       valeurs: {"N": 1.0, "NE": 1.0, "E": 0.9, "NO": 0.9, "O": 0.8, "SE": 0.8, "S": 0.7, "SO": 0.7, plat: 1.0}}

meteo:
  saison: {debut: "05-15", fin: "11-15", rampe_jours: 15}
  combinaison: moyenne_geometrique
  indicateurs:
    pluie_15j: {type: trapeze, poids: 3, points: [15, 40, 150, 300], plancher_haut: 0.5}
    tmoy_7j:   {type: trapeze, poids: 2, points: [9, 13, 22, 27]}
  gel: {seuil_tmin: 0, fenetre_jours: 7, paliers: {1: 0.5, 3: 0.1}}

sources:
  - Courtecuisse & Duhem ; Eyssartier & Roux
  - Danell 1999, Cantharellus, in Ectomycorrhizal Fungi – Key Genera in Profile
  - Büntgen et al. 2012 ; Boddy et al. 2014
