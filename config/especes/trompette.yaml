# Trompette de la mort – valeurs validées le 22/10/2026 (PLAN.md §4), ajustées le 23/10/2026 après calibrage.
id: trompette
nom: Trompette de la mort
taxons: [Craterellus cornucopioides]
avertissement: null

habitat:
  combinaison: moyenne_geometrique
  facteurs:
    essence:
      {couche: foret, type: table, poids: 3, bloquant: true, defaut: 0,
       valeurs: {hetre: 1.0, chenes_decidus: 0.5, chataignier: 0.5, robinier: 0.1,
                 autres_feuillus: 0.7, melange_feuillus: 0.9, peupleraie: 0.1, sapin_epicea: 0.4,
                 pin_sylvestre: 0.1, autres_pins: 0.0, meleze: 0.0, douglas: 0.1,
                 melange_coniferes: 0.2, mixte_feuillus: 0.9, mixte_coniferes: 0.6,
                 foret_ouverte: 0.3, lande_ligneuse: 0.0}}
    substrat:
      {couche: geol, type: table, poids: 2,
       valeurs: {siliceux: 0.6, detritique_mixte: 0.8, marno_calcaire: 1.0, calcaire: 1.0,
                 alluvions_recentes: 0.6, indetermine: 0.7}}
    ph:       {couche: ph, type: trapeze, poids: 0.5, points: [4.5, 5.5, 7.5, 8.3], plancher: 0.4}
    altitude: {couche: alt, type: trapeze, poids: 1, points: [100, 250, 1300, 1600]}
    pente:    {couche: pente, type: trapeze, poids: 1, points: [0, 0, 35, 50], plancher: 0.3}
    exposition:
      {couche: expo, type: table, poids: 0.5,
       valeurs: {"N": 1.0, "NE": 1.0, "NO": 0.9, "E": 0.8, "O": 0.7, "SE": 0.6, "S": 0.5, "SO": 0.5, plat: 1.0}}

meteo:
  saison: {debut: "08-01", fin: "12-15", rampe_jours: 15}
  combinaison: moyenne_geometrique
  indicateurs:
    pluie_15j: {type: trapeze, poids: 3, points: [25, 40, 200, 350], plancher_haut: 0.5}
    tmoy_7j:   {type: trapeze, poids: 2, points: [5, 9, 17, 22]}
  gel: {seuil_tmin: 0, fenetre_jours: 7, paliers: {1: 0.7, 3: 0.3}}

sources:
  - Courtecuisse & Duhem ; Eyssartier & Roux
  - Boddy et al. 2014
